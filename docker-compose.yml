services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: orglimp
      DB_USER: root
      DB_PASSWORD: root
      APP_PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orglimp-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orglimp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - orglimp-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  orglimp-network:
    driver: bridge
