<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <!--BOOTSTRAP - CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<script src="js/app.js"></script>
<script>renderShell('supervisor_notificacoes.html','supervisor');</script>
<main class="main-content">

<section class="page-title"><h1>Notificações</h1><button class="btn btn-outline-primary" onclick="markAll()">Marcar todas como lidas</button></section>
<div class="card"><div class="card-body" id="list"></div></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function render(){const notes=getNotifications(getSession().id);list.innerHTML=notes.map(n=>`<div class="p-3 mb-2 rounded ${n.lida?'':'notification-unread'}" onclick="read(${n.id})"><div class="d-flex justify-content-between"><strong>${n.titulo}</strong><small>${formatDateTime(n.data)}</small></div><div>${n.mensagem}</div>${n.lida?'':'<span class="badge bg-primary mt-2">Nova</span>'}</div>`).join('')||'<div class="empty-state">Nenhuma notificação.</div>';}
function read(id){markNotificationRead(id);render();}function markAll(){getNotifications(getSession().id).forEach(n=>markNotificationRead(n.id));render();}render();
</script>

</body></html>
