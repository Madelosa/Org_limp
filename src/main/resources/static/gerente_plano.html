<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <!--BOOTSTRAP - CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   
        <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<script src="js/app.js"></script>
<script>renderShell('gerente_plano.html','gerente');</script>
<main class="main-content">

<section class="page-title"><h1>Plano Semanal</h1><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPlano"><i class="bi bi-plus-lg"></i> Novo planejamento</button></section>
<div class="filters row g-3"><div class="col-md-4"><label class="form-label">Semana</label><input type="week" id="weekFilter" class="form-control"></div><div class="col-md-4"><label class="form-label">Supervisor</label><select id="supFilter" class="form-select"></select></div><div class="col-md-4"><label class="form-label">Status</label><select id="statusFilter" class="form-select"><option value="">Todos</option><option>pendente</option><option>iniciada</option><option>em andamento</option><option>concluída</option></select></div></div>
<div class="card"><div class="card-body table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Data</th><th>Tarefa</th><th>Local</th><th>Horário</th><th>Supervisor</th><th>Status</th></tr></thead><tbody id="planBody"></tbody></table></div></div>
<div class="modal fade" id="modalPlano" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Novo planejamento</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><p class="text-muted">O planejamento semanal é criado a partir do cadastro de tarefas. Use <strong>Tarefas → Nova tarefa</strong> para inserir atividades.</p></div></div></div></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const sups=getJSON(STORAGE.users,[]).filter(u=>u.perfil==='supervisor'); supFilter.innerHTML='<option value="">Todos</option>'+sups.map(u=>`<option value="${u.id}">${u.nome}</option>`).join('');
function renderPlan(){let list=getTasks(); const sup=supFilter.value, st=statusFilter.value; if(sup)list=list.filter(t=>String(t.supervisor_id)===sup);if(st)list=list.filter(t=>t.status===st);planBody.innerHTML=list.map(t=>`<tr><td>${formatDate(t.data)}</td><td>${t.titulo}</td><td>${t.local}</td><td>${t.hora}</td><td>${userById(t.supervisor_id)?.nome||'-'}</td><td>${statusBadge(t.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="text-center py-4">Nenhuma atividade encontrada.</td></tr>';}
[supFilter,statusFilter,weekFilter].forEach(x=>x.addEventListener('change',renderPlan));renderPlan();
</script>

</body></html>
