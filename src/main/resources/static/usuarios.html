<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <!--BOOTSTRAP - CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<script src="js/app.js"></script>
<script>renderShell('usuarios.html','gerente');</script>
<main class="main-content">

<section class="page-title"><h1>Usuários</h1><button class="btn btn-primary" onclick="openUser()"><i class="bi bi-person-plus"></i> Novo usuário</button></section>
<div class="card"><div class="card-body table-responsive"><table class="table align-middle"><thead><tr><th>Usuário</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody id="usersBody"></tbody></table></div></div>
<div class="modal fade" id="userModal"><div class="modal-dialog"><div class="modal-content"><form id="userForm"><div class="modal-header"><h5 id="userTitle">Novo usuário</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="userId"><div class="mb-3"><label class="form-label">Nome</label><input id="userNome" class="form-control" required></div><div class="mb-3"><label class="form-label">E-mail</label><input id="userEmail" type="email" class="form-control" required></div><div class="mb-3"><label class="form-label">Perfil</label><select id="userPerfil" class="form-select"><option value="gerente">Gerente</option><option value="supervisor">Supervisor</option></select></div><div class="form-check"><input id="userAtivo" class="form-check-input" type="checkbox" checked><label class="form-check-label">Usuário ativo</label></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary">Salvar</button></div></form></div></div></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function renderUsers(){usersBody.innerHTML=getJSON(STORAGE.users,[]).map(u=>`<tr><td>${u.nome}</td><td>${u.email}</td><td><span class="badge ${u.perfil==='gerente'?'bg-primary':'bg-dark'}">${u.perfil}</span></td><td>${u.ativo?'<span class="badge bg-success">Ativo</span>':'<span class="badge bg-secondary">Inativo</span>'}</td><td><button class="btn btn-sm btn-outline-primary" onclick="editUser(${u.id})"><i class="bi bi-pencil"></i></button></td></tr>`).join('');}
function openUser(){userForm.reset();userId.value='';userTitle.textContent='Novo usuário';userAtivo.checked=true;new bootstrap.Modal(userModal).show();}
function editUser(id){const u=getJSON(STORAGE.users,[]).find(x=>x.id===id);if(!u)return;userId.value=u.id;userNome.value=u.nome;userEmail.value=u.email;userPerfil.value=u.perfil;userAtivo.checked=u.ativo;userTitle.textContent='Editar usuário';new bootstrap.Modal(userModal).show();}
userForm.addEventListener('submit',e=>{e.preventDefault();const users=getJSON(STORAGE.users,[]);const obj={nome:userNome.value.trim(),email:userEmail.value.trim(),perfil:userPerfil.value,ativo:userAtivo.checked};if(userId.value){const u=users.find(x=>x.id===Number(userId.value));Object.assign(u,obj);}else{users.push({id:Date.now(),...obj});}setJSON(STORAGE.users,users);bootstrap.Modal.getInstance(userModal).hide();renderUsers();});renderUsers();
</script>

</body></html>
