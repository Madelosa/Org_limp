<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <!--BOOTSTRAP - CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
        <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<script src="js/app.js"></script>
<script>renderShell('gerente_relatorios.html','gerente');</script>
<main class="main-content">

<section class="page-title" ><h1>Relatórios</h1><button class="btn btn-outline-primary" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button></section>
<div class="row g-4">
<div class="col-md-3"><div class="card p-4"><div class="small-muted">Total de tarefas</div><div class="kpi" id="total"></div></div></div>
<div class="col-md-3"><div class="card p-4"><div class="small-muted">Concluídas</div><div class="kpi" id="done"></div></div></div>
<div class="col-md-3"><div class="card p-4"><div class="small-muted">Pendentes</div><div class="kpi" id="pending"></div></div></div>
<div class="col-md-3"><div class="card p-4"><div class="small-muted">Taxa de conclusão</div><div class="kpi" id="rate"></div></div></div>
</div>
<div class="card mt-4"><div class="card-header">Resumo por supervisor</div><div class="card-body table-responsive"><table class="table"><thead><tr><th>Supervisor</th><th>Total</th><th>Concluídas</th><th>Em aberto</th></tr></thead><tbody id="reportBody"></tbody></table></div></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const ts=getTasks();const done=ts.filter(t=>t.status==='concluída').length;total.textContent=ts.length;document.getElementById('done').textContent=done;pending.textContent=ts.filter(t=>t.status==='pendente').length;rate.textContent=ts.length?Math.round(done/ts.length*100)+'%':'0%';
reportBody.innerHTML=getJSON(STORAGE.users,[]).filter(u=>u.perfil==='supervisor').map(u=>{const a=ts.filter(t=>t.supervisor_id===u.id);return `<tr><td>${u.nome}</td><td>${a.length}</td><td>${a.filter(t=>t.status==='concluída').length}</td><td>${a.filter(t=>t.status!=='concluída').length}</td></tr>`}).join('');
</script>

</body></html>
