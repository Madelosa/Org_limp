<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <!--BOOTSTRAP - CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<script src="js/app.js"></script>
<script>renderShell('supervisor_tarefas.html','supervisor');</script>
<main class="main-content">

<section class="page-title"><h1>Minhas Tarefas</h1><div class="date">Atualização de status em tempo real</div></section>
<div class="filters row g-3"><div class="col-md-5"><label class="form-label">Buscar</label><input id="search" class="form-control" placeholder="Título ou local"></div><div class="col-md-4"><label class="form-label">Status</label><select id="statusFilter" class="form-select"><option value="">Todos</option><option>pendente</option><option>iniciada</option><option>em andamento</option><option>concluída</option></select></div></div>
<div class="card"><div class="card-body table-responsive"><table class="table align-middle"><thead><tr><th>Tarefa</th><th>Local</th><th>Data/Hora</th><th>Status</th><th>Observação</th><th>Ação</th></tr></thead><tbody id="body"></tbody></table></div></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function render(){let list=getTasks().filter(t=>t.supervisor_id===getSession().id),q=search.value.toLowerCase(),st=statusFilter.value;if(q)list=list.filter(t=>(t.titulo+' '+t.local).toLowerCase().includes(q));if(st)list=list.filter(t=>t.status===st);body.innerHTML=list.map(t=>`<tr><td><strong>${t.titulo}</strong></td><td>${t.local}</td><td>${formatDate(t.data)}<br>${t.hora}</td><td>${statusBadge(t.status)}</td><td>${t.observacao||'-'}</td><td><button class="btn btn-sm btn-primary" onclick="changeStatus(${t.id})">Atualizar</button></td></tr>`).join('')||'<tr><td colspan="6" class="text-center py-4">Nenhuma tarefa.</td></tr>';}
function changeStatus(id){const t=getTasks().find(x=>x.id===id);const next=prompt('Digite o novo status: pendente, iniciada, em andamento ou concluída',t.status);const valid=['pendente','iniciada','em andamento','concluída'];if(next&&valid.includes(next.toLowerCase())){const obs=prompt('Observação (opcional):',t.observacao||'');updateTask(id,{status:next.toLowerCase(),observacao:obs||''});render();}}
[search,statusFilter].forEach(x=>x.addEventListener('input',render));render();
</script>

</body></html>
