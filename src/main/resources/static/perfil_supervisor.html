<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<script src="js/app.js"></script>
<script>renderShell('perfil_supervisor.html','supervisor');</script>
<main class="main-content">

<section class="page-title"><h1>Meu Perfil</h1></section>
<div class="card"><div class="card-body"><form id="profileForm" class="row g-3"><div class="col-md-6"><label class="form-label">Nome</label><input id="nome" class="form-control"></div><div class="col-md-6"><label class="form-label">E-mail</label><input id="email" type="email" class="form-control"></div><div class="col-12"><button class="btn btn-primary">Salvar alterações</button></div></form></div></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const ps=getSession();nome.value=ps.nome;email.value=ps.email;profileForm.addEventListener('submit',e=>{e.preventDefault();const users=getJSON(STORAGE.users,[]);const u=users.find(x=>x.id===ps.id);u.nome=nome.value.trim();u.email=email.value.trim();setJSON(STORAGE.users,users);setJSON(STORAGE.session,{...ps,nome:u.nome,email:u.email});alert('Perfil atualizado.');});
</script>

</body></html>
