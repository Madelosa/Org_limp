<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <!--BOOTSTRAP - CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<script src="js/app.js"></script>
<script>renderShell('gerente_configuracoes.html','gerente');</script>
<main class="main-content">

<section class="page-title"><h1>Configurações</h1></section>
<div class="row g-4">
<div class="col-lg-7"><div class="card"><div class="card-header">Preferências de comunicação</div><div class="card-body"><form id="settingsForm"><div class="mb-3"><label class="form-label">Nome da empresa</label><input id="empresa" class="form-control"></div><div class="mb-3"><label class="form-label">E-mail para notificações</label><input id="email" type="email" class="form-control"></div><div class="mb-3"><label class="form-label">WhatsApp</label><input id="whatsapp" class="form-control" placeholder="+55 11 99999-9999"></div><div class="form-check mb-2"><input id="notificarEmail" class="form-check-input" type="checkbox"><label class="form-check-label">Enviar notificações por e-mail</label></div><div class="form-check mb-3"><input id="notificarWhatsApp" class="form-check-input" type="checkbox"><label class="form-check-label">Enviar notificações por WhatsApp</label></div><button class="btn btn-primary">Salvar configurações</button></form></div></div></div>
<div class="col-lg-5"><div class="card"><div class="card-header">Integrações</div><div class="card-body"><p><i class="bi bi-database"></i> MySQL: preparado via API </p><p><i class="bi bi-envelope"></i> E-mail: endpoint preparado.</p><p><i class="bi bi-whatsapp"></i> WhatsApp: endpoint preparado para provedor oficial/API.</p><div class="alert alert-info">Na versão demonstrativa, o navegador usa LocalStorage. Veja <code>README.md</code> para ativar o backend.</div></div></div></div>
</div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const cfg=getJSON(STORAGE.settings,{});empresa.value=cfg.empresa||'';email.value=cfg.email||'';whatsapp.value=cfg.whatsapp||'';notificarEmail.checked=!!cfg.notificarEmail;notificarWhatsApp.checked=!!cfg.notificarWhatsApp;
settingsForm.addEventListener('submit',e=>{e.preventDefault();setJSON(STORAGE.settings,{empresa:empresa.value,email:email.value,whatsapp:whatsapp.value,notificarEmail:notificarEmail.checked,notificarWhatsApp:notificarWhatsApp.checked});alert('Configurações salvas.');});
</script>

</body></html>
