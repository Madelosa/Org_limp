<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <!--BOOTSTRAP - CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<script src="js/app.js"></script>
<script>renderShell('gerente_tarefas.html','gerente');</script>
<main class="main-content">

<section class="page-title"><h1>Cadastro de Tarefas</h1><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="prepareNewTask()"><i class="bi bi-plus-lg"></i> Nova tarefa</button></section>
<div class="filters row g-3">
<div class="col-md-3"><label class="form-label">Buscar</label><input id="search" class="form-control" placeholder="Título ou local"></div>
<div class="col-md-3"><label class="form-label">Supervisor</label><select id="filterSup" class="form-select"></select></div>
<div class="col-md-3"><label class="form-label">Status</label><select id="filterStatus" class="form-select"><option value="">Todos</option><option>pendente</option><option>iniciada</option><option>em andamento</option><option>concluída</option></select></div>
<div class="col-md-3"><label class="form-label">Itens por página</label><select id="pageSize" class="form-select"><option>5</option><option>10</option><option>20</option></select></div>
</div>
<div class="card"><div class="card-body table-responsive"><table class="table table-hover align-middle"><thead><tr><th>ID</th><th>Tarefa</th><th>Local</th><th>Data/Hora</th><th>Supervisor</th><th>Status</th><th>Ações</th></tr></thead><tbody id="taskBody"></tbody></table><nav><ul class="pagination justify-content-end" id="pagination"></ul></nav></div></div>
<div class="modal fade" id="taskModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 id="modalTitle">Nova tarefa</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><form id="taskForm"><div class="modal-body"><input type="hidden" id="taskId"><div class="row g-3"><div class="col-md-8"><label class="form-label">Título</label><input id="titulo" class="form-control" required></div><div class="col-md-4"><label class="form-label">Supervisor</label><select id="supervisor_id" class="form-select" required></select></div><div class="col-md-6"><label class="form-label">Local da atividade</label><input id="local" class="form-control" required></div><div class="col-md-3"><label class="form-label">Data</label><input id="data" type="date" class="form-control" required></div><div class="col-md-3"><label class="form-label">Horário</label><input id="hora" type="time" class="form-control" required></div><div class="col-md-6"><label class="form-label">Prazo</label><input id="prazo" type="date" class="form-control" required></div><div class="col-md-6"><label class="form-label">Status</label><select id="status" class="form-select"><option>pendente</option><option>iniciada</option><option>em andamento</option><option>concluída</option></select></div><div class="col-12"><label class="form-label">Observação</label><textarea id="observacao" class="form-control" rows="3"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary">Salvar tarefa</button></div></form></div></div></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const supervisors=getJSON(STORAGE.users,[]).filter(u=>u.perfil==='supervisor');
filterSup.innerHTML='<option value="">Todos</option>'+supervisors.map(u=>`<option value="${u.id}">${u.nome}</option>`).join('');
supervisor_id.innerHTML=supervisors.map(u=>`<option value="${u.id}">${u.nome}</option>`).join('');
let currentPage=1;
function filteredTasks(){let list=getTasks(), q=search.value.toLowerCase().trim(), sup=filterSup.value, st=filterStatus.value;
 if(q)list=list.filter(t=>(t.titulo+' '+t.local).toLowerCase().includes(q)); if(sup)list=list.filter(t=>String(t.supervisor_id)===sup); if(st)list=list.filter(t=>t.status===st); return list;}
function renderTasks(){const list=filteredTasks(), size=Number(pageSize.value), pages=Math.max(1,Math.ceil(list.length/size));currentPage=Math.min(currentPage,pages);const rows=list.slice((currentPage-1)*size,currentPage*size);
 taskBody.innerHTML=rows.map(t=>`<tr><td>${t.id}</td><td><strong>${t.titulo}</strong><div class="small-muted">${t.observacao||''}</div></td><td>${t.local}</td><td>${formatDate(t.data)}<br>${t.hora}</td><td>${userById(t.supervisor_id)?.nome||'-'}</td><td>${statusBadge(t.status)}</td><td><button class="btn btn-sm btn-outline-primary" onclick="editTask(${t.id})"><i class="bi bi-pencil"></i></button></td></tr>`).join('')||'<tr><td colspan="7" class="text-center py-4">Nenhuma tarefa encontrada.</td></tr>';
 pagination.innerHTML=Array.from({length:pages},(_,i)=>`<li class="page-item ${i+1===currentPage?'active':''}"><button class="page-link" onclick="currentPage=${i+1};renderTasks()">${i+1}</button></li>`).join('');
}
function prepareNewTask(){taskForm.reset();taskId.value='';modalTitle.textContent='Nova tarefa';status.value='pendente';data.value=new Date().toISOString().slice(0,10);prazo.value=data.value;}
function editTask(id){const t=getTasks().find(x=>x.id===id); if(!t)return; taskId.value=t.id;titulo.value=t.titulo;local.value=t.local;data.value=t.data;hora.value=t.hora;prazo.value=t.prazo;supervisor_id.value=t.supervisor_id;status.value=t.status;observacao.value=t.observacao||'';modalTitle.textContent='Editar tarefa';new bootstrap.Modal(taskModal).show();}
taskForm.addEventListener('submit',e=>{e.preventDefault();const dataObj={titulo:titulo.value.trim(),local:local.value.trim(),data:data.value,hora:hora.value,prazo:prazo.value,supervisor_id:Number(supervisor_id.value),status:status.value,observacao:observacao.value.trim()};
 if(taskId.value) updateTask(Number(taskId.value),dataObj); else createTask(dataObj); bootstrap.Modal.getInstance(taskModal).hide();renderTasks();});
[search,filterSup,filterStatus,pageSize].forEach(el=>el.addEventListener('input',()=>{currentPage=1;renderTasks()}));renderTasks();
</script>

</body></html>
