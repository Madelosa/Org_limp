<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <!-- BOOTSTRAP - CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
<main class="login-card">
     <img src="img/log.png" class="img-fluid" width=80px height=80px alt="Logo da empresa" />
    <div class="login-logo">GESTÃO DE LIMPEZA</div>
    <p class="text-center text-muted">Controle, acompanhamento e registro das atividades.</p>
    <form id="loginForm" novalidate>
        <div class="mb-3"><label class="form-label">E-mail</label><input id="email" type="email" class="form-control" required value="gerente@empresa.com"></div>
        <div class="mb-3"><label class="form-label">Senha</label><input id="senha" type="password" class="form-control" required value="123456"></div>
        <div id="loginError" class="alert alert-danger d-none"></div>
        <button class="btn btn-primary w-100 py-2">Entrar</button>
    </form>
    <div class="small text-muted mt-3">Demo: gerente@empresa.com / 123456 · supervisor@empresa.com / 123456</div>
</main>
<script src="js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', e=>{
    e.preventDefault();
    const email=document.getElementById('email').value.trim().toLowerCase();
    const user=getJSON(STORAGE.users,[]).find(u=>u.email.toLowerCase()===email && u.ativo);
    if(!user){ document.getElementById('loginError').textContent='Usuário não encontrado ou inativo.'; document.getElementById('loginError').classList.remove('d-none'); return; }
    setJSON(STORAGE.session,{id:user.id,nome:user.nome,email:user.email,perfil:user.perfil});
    location.href=user.perfil==='gerente'?'dashboard-gerente.html':'dashboard_supervisor.html';
});
</script>
</body>
</html>
