<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <!--BOOTSTRAP - CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<script src="js/app.js"></script>
<script>renderShell('dashboard_supervisor.html','supervisor');</script>
<main class="main-content">

<section class="page-title"><div><h1>Página Inicial</h1><div class="welcome">Seja bem-vindo!</div></div><div class="date" id="today"></div></section>
<div class="stats-grid">
<div class="stat-card"><i class="bi bi-exclamation-triangle icon"></i><div class="value" id="pending">0</div><div class="label">Pendentes</div></div>
<div class="stat-card"><i class="bi bi-clock icon"></i><div class="value" id="started">0</div><div class="label">Iniciadas</div></div>
<div class="stat-card"><i class="bi bi-arrow-repeat icon"></i><div class="value" id="progress">0</div><div class="label">Em andamento</div></div>
<div class="stat-card"><i class="bi bi-check2-square icon"></i><div class="value" id="done">0</div><div class="label">Concluídas</div></div>
</div>
<div class="card mt-4"><div class="card-header">Minhas tarefas recentes</div><div class="card-body" id="myTasks"></div></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const sid=getSession().id, mine=getTasks().filter(t=>t.supervisor_id===sid);today.textContent=pageDate();pending.textContent=mine.filter(t=>t.status==='pendente').length;started.textContent=mine.filter(t=>t.status==='iniciada').length;progress.textContent=mine.filter(t=>t.status==='em andamento').length;done.textContent=mine.filter(t=>t.status==='concluída').length;
myTasks.innerHTML=mine.slice(0,8).map(t=>`<div class="d-flex justify-content-between align-items-center border-bottom py-3"><div><strong>${t.titulo}</strong><div class="small-muted">${t.local} · ${formatDate(t.data)} ${t.hora}</div></div>${statusBadge(t.status)}</div>`).join('')||'<div class="empty-state">Você não possui tarefas.</div>';
</script>

</body></html>
