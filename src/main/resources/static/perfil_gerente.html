<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./img/logo2.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<script src="js/app.js"></script>
<script>renderShell('','gerente');</script>
<main class="main-content">

<section class="page-title"><h1>Perfil do Gerente</h1><div class="date">Dados do usuário</div></section>
<div class="row g-4">
<div class="col-lg-4"><div class="card p-4 text-center"><div class="display-3 mb-3"><i class="bi bi-person-circle"></i></div><h3 id="profileName"></h3><p id="profileEmail" class="text-muted"></p><span class="badge bg-primary">Gerente</span></div></div>
<div class="col-lg-8"><div class="card"><div class="card-header">Dados profissionais</div><div class="card-body"><form id="profileForm"><div class="mb-3"><label class="form-label">Nome</label><input id="nome" class="form-control"></div><div class="mb-3"><label class="form-label">E-mail</label><input id="email" type="email" class="form-control"></div><button class="btn btn-primary">Salvar alterações</button></form></div></div></div>
</div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const s=getSession(); document.getElementById('profileName').textContent=s.nome; document.getElementById('profileEmail').textContent=s.email;
nome.value=s.nome; email.value=s.email;
profileForm.addEventListener('submit',e=>{e.preventDefault(); const users=getJSON(STORAGE.users,[]); const u=users.find(x=>x.id===s.id); u.nome=nome.value.trim(); u.email=email.value.trim(); setJSON(STORAGE.users,users); setJSON(STORAGE.session,{...s,nome:u.nome,email:u.email}); alert('Perfil atualizado.'); location.reload();});
</script>

</body></html>
