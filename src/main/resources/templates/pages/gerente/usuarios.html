<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Org-limp - Usuários</title>
    <link rel="shortcut icon" th:href="@{/img/logo2.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <section class="page-title">
            <h1>Usuários</h1>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal"
                onclick="novoUsuario()">
                <i class="bi bi-person-plus"></i> Novo usuário
            </button>
        </section>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <div class="card">
            <div class="card-body table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Usuário</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="user : ${usuarios}">
                            <td th:text="${user.nome}">Nome</td>
                            <td th:text="${user.email}">E-mail</td>
                            <td>
                                <span class="badge"
                                    th:classappend="${user.perfil.name() == 'gerente'} ? 'bg-primary' : 'bg-dark'"
                                    th:text="${user.perfil.name()}">Perfil</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${user.ativo} ? 'bg-success' : 'bg-secondary'"
                                    th:text="${user.ativo} ? 'Ativo' : 'Inativo'">Status</span>
                            </td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-secondary me-1"
                                    title="Editar usuário" data-bs-toggle="modal" data-bs-target="#userModal"
                                    th:data-id="${user.id}" th:data-nome="${user.nome}" th:data-email="${user.email}"
                                    th:data-perfil="${user.perfil.name()}" th:data-ativo="${user.ativo}"
                                    onclick="editarUsuario(this)">
                                    <i class="bi bi-gear"></i>
                                </button>

                                <form th:action="@{/usuarios/{id}/deletar(id=${user.id})}" method="post"
                                    class="d-inline delete-user-form">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                    <button type="submit" class="btn btn-sm btn-outline-primary" title="Excluir usuário"
                                        onclick="return confirm('Deseja realmente excluir este usuário? Se houver tarefas vinculadas, a exclusão será bloqueada.');">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal de cadastro e edição -->
        <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalTitle" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">

                    <form id="userForm" th:action="@{/usuarios/salvar}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="modal-header">
                            <h5 class="modal-title" id="userModalTitle">Novo usuário</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Fechar"></button>
                        </div>

                        <div class="modal-body">
                            <input type="hidden" id="userId" name="id">

                            <div class="mb-3">
                                <label for="userNome" class="form-label">Nome</label>
                                <input id="userNome" name="nome" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="userEmail" class="form-label">E-mail</label>
                                <input id="userEmail" name="email" type="email" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="userSenha" class="form-label">Senha</label>
                                <input id="userSenha" name="senha" type="password" class="form-control"
                                    autocomplete="new-password">
                                <div class="form-text" id="senhaAjuda">
                                    Informe a senha do novo usuário.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="userPerfil" class="form-label">Perfil</label>
                                <select id="userPerfil" name="perfil" class="form-select" required>
                                    <option value="gerente">Gerente</option>
                                    <option value="supervisor">Supervisor</option>
                                </select>
                            </div>

                            <div class="form-check d-none" id="activeField">
                                <input type="hidden" name="ativo" id="activeValue" value="true" disabled>
                                <input id="activeCheckbox" class="form-check-input" type="checkbox">
                                <label for="activeCheckbox" class="form-check-label">
                                    Usuário ativo
                                </label>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary" id="userSaveButton">
                                <span id="userSaveText">Salvar</span>
                                <span id="userSaveLoading" class="d-none">
                                    <span class="spinner-border spinner-border-sm me-1" role="status"
                                        aria-hidden="true"></span>
                                    Salvando...
                                </span>
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function novoUsuario() {
            const form = document.getElementById('userForm');

            form.reset();

            document.getElementById('userId').value = '';
            document.getElementById('userModalTitle').textContent = 'Novo usuário';
            document.getElementById('userSaveText').textContent = 'Cadastrar';
            document.getElementById('senhaAjuda').textContent =
                'Informe a senha do novo usuário.';

            document.getElementById('activeField').classList.add('d-none');
            document.getElementById('activeValue').disabled = true;

            document.getElementById('userSenha').required = true;
        }

        function editarUsuario(botao) {
            const form = document.getElementById('userForm');

            form.reset();

            document.getElementById('userId').value = botao.dataset.id;
            document.getElementById('userNome').value = botao.dataset.nome;
            document.getElementById('userEmail').value = botao.dataset.email;
            document.getElementById('userPerfil').value = botao.dataset.perfil;

            const ativo = botao.dataset.ativo === 'true';

            document.getElementById('activeCheckbox').checked = ativo;
            document.getElementById('activeValue').value = ativo;
            document.getElementById('activeValue').disabled = false;
            document.getElementById('activeField').classList.remove('d-none');

            document.getElementById('userModalTitle').textContent = 'Editar usuário';
            document.getElementById('userSaveText').textContent = 'Salvar alterações';
            document.getElementById('senhaAjuda').textContent =
                'Deixe em branco para manter a senha atual.';

            document.getElementById('userSenha').required = false;
        }

        document.getElementById('activeCheckbox').addEventListener('change', function () {
            document.getElementById('activeValue').value = this.checked;
        });
    </script>
    <script>
        const userForm = document.getElementById('userForm');

        userForm.addEventListener('submit', function () {
            if (!userForm.checkValidity()) {
                return;
            }

            const saveButton = document.getElementById('userSaveButton');
            const saveText = document.getElementById('userSaveText');
            const saveLoading = document.getElementById('userSaveLoading');

            saveButton.disabled = true;
            saveButton.style.minWidth = '150px';
            saveButton.style.opacity = '1';

            saveText.classList.add('d-none');
            saveLoading.classList.remove('d-none');
        });
    </script>
    <script>
        document.querySelectorAll('.alert-success, .alert-danger').forEach(function (alertElement) {
            setTimeout(function () {
                const alert = bootstrap.Alert.getOrCreateInstance(alertElement);
                alert.close();
            }, 6000);
        });
    </script>
    <script>
        document.querySelectorAll('.delete-user-form').forEach(function (form) {
            form.addEventListener('submit', function () {
                const button = form.querySelector('button[type="submit"]');

                if (!button) {
                    return;
                }

                button.disabled = true;
                button.innerHTML = `
                <span class="spinner-border spinner-border-sm me-1"
                      role="status" aria-hidden="true"></span>
                Excluindo...
            `;
            });
        });
    </script>
</body>

</html>
