<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Org-limp - Usuários</title>
    <link rel="shortcut icon" th:href="@{/img/logo2.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="main-content">
    <section class="page-title">
        <h1>Usuários</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" onclick="document.getElementById('userForm').reset(); document.getElementById('userId').value='';">
            <i class="bi bi-person-plus"></i> Novo usuário
        </button>
    </section>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-body table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${usuarios}">
                        <td th:text="${user.nome}">Nome</td>
                        <td th:text="${user.email}">E-mail</td>
                        <td>
                            <span class="badge" th:classappend="${user.perfil.name() == 'gerente'} ? 'bg-primary' : 'bg-dark'" th:text="${user.perfil.name()}">Perfil</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${user.ativo} ? 'bg-success' : 'bg-secondary'" th:text="${user.ativo} ? 'Ativo' : 'Inativo'">Status</span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/{id}/deletar(id=${user.id})}">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Novo Usuário -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="userForm" th:action="@{/usuarios/salvar}" method="post">
                    <div class="modal-header">
                        <h5>Novo usuário</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="userId" name="id">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input name="nome" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input name="email" type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input name="senha" type="password" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Perfil</label>
                            <select name="perfil" class="form-select">
                                <option value="gerente">Gerente</option>
                                <option value="supervisor">Supervisor</option>
                            </select>
                        </div>
                        <div class="form-check">
                            <input name="ativo" class="form-check-input" type="checkbox" checked value="true">
                            <label class="form-check-label">Usuário ativo</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
