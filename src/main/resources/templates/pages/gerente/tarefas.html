<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Org-limp - Tarefas</title>
    <link rel="shortcut icon" th:href="@{/img/logo2.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="main-content">
    <section class="page-title">
        <h1>Cadastro de Tarefas</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="document.getElementById('taskForm').reset(); document.getElementById('taskId').value='';">
            <i class="bi bi-plus-lg"></i> Nova tarefa
        </button>
    </section>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tarefa</th>
                        <th>Local</th>
                        <th>Data/Hora</th>
                        <th>Supervisor</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tarefa : ${tarefas}">
                        <td th:text="${tarefa.id}">1</td>
                        <td>
                            <strong th:text="${tarefa.titulo}">Título</strong>
                            <div class="small-muted" th:text="${tarefa.observacao}">Obs</div>
                        </td>
                        <td th:text="${tarefa.local}">Local</td>
                        <td>
                            <span th:text="${#temporals.format(tarefa.data, 'dd/MM/yyyy')}">Data</span><br>
                            <span th:text="${tarefa.hora}">Hora</span>
                        </td>
                        <td th:text="${tarefa.supervisorId}">Supervisor</td>
                        <td>
                            <span class="badge" th:classappend="${tarefa.status.name() == 'pendente'} ? 'bg-secondary' : (${tarefa.status.name() == 'iniciada'} ? 'bg-info text-dark' : (${tarefa.status.name() == 'em_andamento'} ? 'bg-warning text-dark' : 'bg-success'))" th:text="${tarefa.status.name().replace('_', ' ')}">Status</span>
                        </td>
                        <td>
                            <form th:action="@{/tarefas/{id}/deletar(id=${tarefa.id})}" method="post" class="d-inline"> 
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"> 
                                    <button type="submit" class="btn btn-sm btn-outline-primary" title="Excluir tarefa" onclick="return confirm('Tem certeza que deseja excluir esta tarefa?');">
                                        <i class="bi bi-trash">

                                        </i> 
                                    </button> 
                                </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Nova Tarefa -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Nova tarefa</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="taskForm" th:action="@{/tarefas/salvar}" method="post">
                    <div class="modal-body">
                        <input type="hidden" id="taskId" name="id">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">Título</label>
                                <input name="titulo" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Supervisor</label>
                                <select name="supervisorId" class="form-select" required>
                                    <option th:each="sup : ${supervisores}" th:value="${sup.id}" th:text="${sup.nome}">Supervisor</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Local da atividade</label>
                                <input name="local" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Data</label>
                                <input name="data" type="date" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Horário</label>
                                <input name="hora" type="time" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Prazo</label>
                                <input name="prazo" type="date" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-select">
                                    <option value="pendente">Pendente</option>
                                    <option value="iniciada">Iniciada</option>
                                    <option value="em_andamento">Em andamento</option>
                                    <option value="concluida">Concluída</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Observação</label>
                                <textarea name="observacao" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-primary">Salvar tarefa</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
