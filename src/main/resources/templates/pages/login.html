<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Org-limp - Login</title>
    <link rel="shortcut icon" th:href="@{/img/logo2.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="login-page">
    <main class="login-card">
        <img th:src="@{/img/log.png}" class="img-fluid" width="80px" height="80px" alt="Logo da empresa" />
        <div class="login-logo">GESTÃO DE LIMPEZA</div>
        <p class="text-center text-muted">Controle, acompanhamento e registro das atividades.</p>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span>Você saiu com sucesso.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" th:field="*{email}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" th:field="*{senha}" required>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit" id="loginButton">
                <span id="loginText">Entrar</span>
                <span id="loginLoading" class="d-none">
                    <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                    Entrando...
                </span>
            </button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.alert-danger, .alert-success').forEach(function (alertElement) {
            setTimeout(function () {
                const alert = bootstrap.Alert.getOrCreateInstance(alertElement);
                alert.close();
            }, 6000);
        });
    </script>
    <script>
        const loginForm = document.querySelector('form[action="/login"]');

        loginForm.addEventListener('submit', function () {
            if (!loginForm.checkValidity()) {
                return;
            }

            const loginButton = document.getElementById('loginButton');
            const loginText = document.getElementById('loginText');
            const loginLoading = document.getElementById('loginLoading');

            loginButton.disabled = true;
            loginButton.style.opacity = '1';

            loginText.classList.add('d-none');
            loginLoading.classList.remove('d-none');
        });
    </script>
</body>

</html>
