<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Org-limp - Meu Perfil</title>
    <link rel="shortcut icon" th:href="@{/img/logo2.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="main-content">
    <section class="page-title">
        <h1>Meu Perfil</h1>
    </section>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/usuarios/salvar}" method="post" class="row g-3">
                <input type="hidden" name="id" th:value="${usuario.id}">
                <input type="hidden" name="perfil" value="supervisor">
                <input type="hidden" name="ativo" value="true">
                <div class="col-md-6">
                    <label class="form-label">Nome</label>
                    <input name="nome" class="form-control" th:value="${usuario.nome}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">E-mail</label>
                    <input name="email" type="email" class="form-control" th:value="${usuario.email}">
                </div>
                <div class="col-12">
                    <button class="btn btn-primary">Salvar alterações</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
