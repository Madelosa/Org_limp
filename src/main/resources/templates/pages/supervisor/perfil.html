
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Org-limp - Meu Perfil</title>
    <link rel="shortcut icon" th:href="@{/img/logo2.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="main-content">
    <section class="page-title">
        <h1>Meu Perfil</h1>
    </section>

    <!-- Mensagens de retorno -->
    <div th:if="${successPerfil}" class="alert alert-success alert-dismissible fade show"
         role="alert">
        <span th:text="${successPerfil}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"
                aria-label="Fechar"></button>
    </div>

    <div th:if="${errorPerfil}" class="alert alert-danger alert-dismissible fade show"
         role="alert">
        <span th:text="${errorPerfil}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"
                aria-label="Fechar"></button>
    </div>

    <div th:if="${successSenha}" class="alert alert-success alert-dismissible fade show"
         role="alert">
        <span th:text="${successSenha}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"
                aria-label="Fechar"></button>
    </div>

    <div th:if="${errorSenha}" class="alert alert-danger alert-dismissible fade show"
         role="alert">
        <span th:text="${errorSenha}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"
                aria-label="Fechar"></button>
    </div>

    <!-- Dados do perfil -->
    <div class="card mb-4">
        <div class="card-header">
            <h2 class="h5 mb-0">Dados pessoais</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/supervisor/perfil/atualizar}"
                  method="post"
                  class="row g-3">

                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input id="nome" name="nome" class="form-control"
                           th:value="${usuario.nome}" required maxlength="150">
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input id="email" name="email" type="email"
                           class="form-control" th:value="${usuario.email}"
                           required maxlength="150">
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Salvar alterações
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Alteração de senha -->
    <div class="card mb-4">
        <div class="card-header">
            <h2 class="h5 mb-0">Alterar senha</h2>
        </div>
        <div class="card-body">
            <p class="text-muted">
                Para sua segurança, informe sua senha atual antes de cadastrar
                uma nova senha.
            </p>

            <form th:action="@{/supervisor/perfil/alterar-senha}"
                  method="post"
                  class="row g-3">

                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="col-md-6">
                    <label for="senhaAtual" class="form-label">Senha atual</label>
                    <input id="senhaAtual" name="senhaAtual" type="password"
                           class="form-control" autocomplete="current-password"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="novaSenha" class="form-label">Nova senha</label>
                    <input id="novaSenha" name="novaSenha" type="password"
                           class="form-control" autocomplete="new-password"
                           minlength="8"
                           pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}"
                           title="Use pelo menos 8 caracteres, incluindo uma letra maiúscula, uma minúscula e um número."
                           required>
                    <div class="form-text">
                        Mínimo de 8 caracteres, com maiúscula, minúscula e número.
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Alterar senha
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
