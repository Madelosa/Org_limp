<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Org-limp - Dashboard</title>
    <link rel="shortcut icon" th:href="@{/img/logo2.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="main-content">
    <section class="page-title">
        <div><h1>Página Inicial</h1><div class="welcome">Seja bem-vindo!</div></div>
        <div class="date" th:text="${#temporals.format(#temporals.createNow(), 'EEEE, dd MMMM yyyy')}">Data</div>
    </section>

    <div class="stats-grid">
        <div class="stat-card">
            <i class="bi bi-exclamation-triangle icon"></i>
            <div class="value" th:text="${#lists.size(tarefas.?[status.name() == 'pendente'])}">0</div>
            <div class="label">Pendentes</div>
        </div>
        <div class="stat-card">
            <i class="bi bi-clock icon"></i>
            <div class="value" th:text="${#lists.size(tarefas.?[status.name() == 'iniciada'])}">0</div>
            <div class="label">Iniciadas</div>
        </div>
        <div class="stat-card">
            <i class="bi bi-arrow-repeat icon"></i>
            <div class="value" th:text="${#lists.size(tarefas.?[status.name() == 'em_andamento'])}">0</div>
            <div class="label">Em andamento</div>
        </div>
        <div class="stat-card">
            <i class="bi bi-check2-square icon"></i>
            <div class="value" th:text="${#lists.size(tarefas.?[status.name() == 'concluida'])}">0</div>
            <div class="label">Concluídas</div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header">Minhas tarefas recentes</div>
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center border-bottom py-3" th:each="tarefa, iter : ${tarefas}" th:if="${iter.index < 8}">
                <div>
                    <strong th:text="${tarefa.titulo}">Tarefa</strong>
                    <div class="small-muted">
                        <span th:text="${tarefa.local}">Local</span> ·
                        <span th:text="${#temporals.format(tarefa.data, 'dd/MM/yyyy')}">Data</span>
                        <span th:text="${tarefa.hora}">Hora</span>
                    </div>
                </div>
                <span class="badge" th:classappend="${tarefa.status.name() == 'pendente'} ? 'bg-secondary' : (${tarefa.status.name() == 'iniciada'} ? 'bg-info text-dark' : (${tarefa.status.name() == 'em_andamento'} ? 'bg-warning text-dark' : 'bg-success'))" th:text="${tarefa.status.name().replace('_', ' ')}">Status</span>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(tarefas)}">Você não possui tarefas.</div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
