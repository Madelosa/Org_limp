<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Org-limp</title>
    <link rel="shortcut icon" th:href="@{/img/logo2.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<header class="app-header" th:fragment="header">
    <div class="logo">
        <img th:src="@{/img/log.png}" class="img-fluid" width="80px" height="80px" alt="Logo da empresa" />
    </div>
    <div class="header-user">
        <span><i class="bi bi-bell-fill"></i> <span th:text="${naoLidas}">0</span></span>
        <span th:text="${usuario.nome}">Usuário</span>
        <div class="dropdown">
            <button class="dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-chevron-down"></i></button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <a class="dropdown-item" th:href="${usuario.perfil.name() == 'gerente'} ? @{/gerente/perfil} : @{/supervisor/perfil}">
                        <i class="bi bi-person"></i> Perfil
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                
<li>
    <form th:action="@{/logout}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <button type="submit" class="dropdown-item">
            <i class="bi bi-box-arrow-right"></i> Sair
        </button>
    </form>
</li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
