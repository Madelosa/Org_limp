<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar">
    <nav class="nav flex-column">
        <!-- Gerente -->
        <th:block th:if="${usuario.perfil.name() == 'gerente'}">
            <a class="nav-link" data-page="gerente/dashboard" th:href="@{/gerente/dashboard}">
                <i class="bi bi-house-fill"></i><span>Página Inicial</span>
            </a>
            <a class="nav-link" data-page="gerente/plano" th:href="@{/gerente/plano}">
                <i class="bi bi-calendar-check"></i><span>Plano Semanal</span>
            </a>
            <a class="nav-link" data-page="gerente/tarefas" th:href="@{/gerente/tarefas}">
                <i class="bi bi-pencil-square"></i><span>Tarefas</span>
            </a>
            <a class="nav-link" data-page="gerente/relatorios" th:href="@{/gerente/relatorios}">
                <i class="bi bi-file-earmark-bar-graph"></i><span>Relatórios</span>
            </a>
            <a class="nav-link" data-page="gerente/notificacoes" th:href="@{/gerente/notificacoes}">
                <i class="bi bi-bell-fill"></i><span>Notificações</span>
            </a>
            <a class="nav-link" data-page="gerente/usuarios" th:href="@{/gerente/usuarios}">
                <i class="bi bi-people-fill"></i><span>Usuários</span>
            </a>
            <a class="nav-link" data-page="gerente/configuracoes" th:href="@{/gerente/configuracoes}">
                <i class="bi bi-gear-fill"></i><span>Configurações</span>
            </a>
        </th:block>

        <!-- Supervisor -->
        <th:block th:if="${usuario.perfil.name() == 'supervisor'}">
            <a class="nav-link" data-page="supervisor/dashboard" th:href="@{/supervisor/dashboard}">
                <i class="bi bi-house-fill"></i><span>Página Inicial</span>
            </a>
            <a class="nav-link" data-page="supervisor/tarefas" th:href="@{/supervisor/tarefas}">
                <i class="bi bi-list-check"></i><span>Minhas Tarefas</span>
            </a>
            <a class="nav-link" data-page="supervisor/notificacoes" th:href="@{/supervisor/notificacoes}">
                <i class="bi bi-bell-fill"></i><span>Notificações</span>
            </a>
            <a class="nav-link" data-page="supervisor/perfil" th:href="@{/supervisor/perfil}">
                <i class="bi bi-person-circle"></i><span>Meu Perfil</span>
            </a>
        </th:block>
    </nav>
</aside>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link[data-page]');
        navLinks.forEach(link => {
            const page = link.getAttribute('data-page');
            if (currentPath.includes(page)) {
                link.classList.add('active');
            }
        });
    });
</script>
</body>
</html>
