                Minhas Tarefas
            </h2>
            
            <!-- FILTROS -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-md-5">
                            <label for="pesquisa" class="form-label">
                                Pesquisar
                            </label>

                            <input
                                type="text"
                                id="pesquisa"
                                class="form-control"
                                placeholder="Pesquisar tarefa ou local..."
                            >
                        </div>

                        <div class="col-md-3">
                            <label for="filtroStatus" class="form-label">
                                Status
                            </label>

                            <select
                                id="filtroStatus"
                                class="form-select"
                            >
                                <option value="">Todos</option>
                                <option value="Pendente">Pendente</option>
                                <option value="Iniciada">Iniciada</option>
                                <option value="Em andamento">
                                    Em andamento
                                </option>
                                <option value="Concluída">
                                    Concluída
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="filtroPrioridade" class="form-label">
                                Prioridade
                            </label>

                            <select
                                id="filtroPrioridade"
                                class="form-select"
                            >
                                <option value="">Todas</option>
                                <option value="Alta">Alta</option>
                                <option value="Média">Média</option>
                                <option value="Baixa">Baixa</option>
                            </select>
                        </div>

                    </div>

                </div>
            </div>

            <!-- TABELA -->
            <div class="card shadow-sm">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-primary">

                            <tr>
                                <th>Tarefa</th>
                                <th>Local</th>
                                <th>Prioridade</th>
                                <th>Prazo</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>

                        </thead>

                        <tbody id="listaMinhasTarefas"></tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>
</div>

<!-- MODAL ATUALIZAR TAREFA -->

<div
    class="modal fade"
    id="modalAtualizarTarefa"
    tabindex="-1"
    aria-hidden="true"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header bg-primary text-white">

                <h5 class="modal-title">
                    Atualizar Tarefa
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div class="modal-body">

                <form id="formAtualizarTarefa">

                    <input type="hidden" id="idTarefa">

                    <div class="mb-3">

                        <label class="form-label">
                            Tarefa
                        </label>

                        <input
                            type="text"
                            id="nomeTarefa"
                            class="form-control"
                            readonly
                        >

                    </div>

                    <div class="mb-3">

                        <label
                            for="novoStatus"
                            class="form-label"
                        >
                            Status
                        </label>

                        <select
                            id="novoStatus"
                            class="form-select"
                            required
                        >
                            <option value="Pendente">
                                Pendente
                            </option>

                            <option value="Iniciada">
                                Iniciada
                            </option>

                            <option value="Em andamento">
                                Em andamento
                            </option>

                            <option value="Concluída">
                                Concluída
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label
                            for="observacao"
                            class="form-label"
                        >
                            Observações
                        </label>

                        <textarea
                            id="observacao"
                            class="form-control"
                            rows="4"
                            maxlength="500"
                            placeholder="Informe observações sobre a atividade..."
                        ></textarea>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancelar
                </button>

                <button
                    type="button"
                    class="btn btn-success"
                    id="btnSalvarAtualizacao"
                >
                    <i class="bi bi-check-circle"></i>
                    Atualizar
                </button>

            </div>

        </div>

    </div>

</div>
