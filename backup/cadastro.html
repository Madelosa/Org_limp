<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo e favicon - definir o ícone da aba do navegador-->
    <title>Org-limp</title>
    <link rel="shortcut icon" href="./assets/img/logo2.png" type="image/x-icon">
    <!-- BOOTSTRAP - CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
   
</head>

<body>

    <div class="login-container" style="display: flex;  
            min-height: 100vh;" >
        <!-- Seção esquerda: Imagem da marca -->
        <aside class="login-banner" style="flex: 1; background-color: #000; display: flex;
             justify-content: center; align-items: center;">
            <img src="./assets/img/logo.png" class="img-fluid" alt="Logo de la empresa">

        </aside>

       <!-- LADO DIREITO -->

        <div class="col-lg-6 d-flex justify-content-center align-items-center">

        <div class="card shadow cadastro-card">

        <div class="card-body p-5">

        <h2 class="text-center text-primary">

        Crie sua conta

        </h2>

        <h4 class="text-center text-secondary mb-4">

        Cadastre seus dados

        </h4>

        <form>

        <div class="mb-3">

        <label>E-mail</label>

        <input
        type="email"
        class="form-control"
        placeholder="Digite seu e-mail">

        </div>

        <div class="mb-3">

        <label>Senha</label>

        <div class="input-group">

        <input
        type="password"
        class="form-control"
        placeholder="************"
        id="senha">

        <button
        class="btn btn-outline-secondary"
        type="button"
        onclick="mostrarSenha()">

        <i class="bi bi-eye"></i>

        </button>

        </div>

         <div class="mb-3">

        <label>Repita a Senha</label>

        <div class="input-group">

        <input
        type="password"
        class="form-control"
        placeholder="************"
        id="senha">

        <button
        class="btn btn-outline-secondary"
        type="button"
        onclick="mostrarSenha()">

        <i class="bi bi-eye"></i>

        </button>

        </div>


        </div>

        <div class="form-check">

        <input
        class="form-check-input"
        type="checkbox">

        <label>

        Lembre de mim

        </label>

        </div>

        

        <div class="d-grid mt-4">

        <button class="btn btn-primary btn-lg">

        CADASTRAR

        </button>
          <br>
          <h6 class="mt-2 text-center">Não tem uma conta? <a href="login.html" class="text-decoration-none">Fazer login</a></h6>
     
        </div>

        </form>

        </div>

        </div>

        </div>

        </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>

</html>
